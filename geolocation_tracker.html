<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Multi-Device Live Map & GPS Fleet Tracker</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet Interactive Map Engine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    .gps-pulse-ring {
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    /* Custom Leaflet popup styling */
    .leaflet-popup-content-wrapper {
      background: #0f172a !important;
      color: #f8fafc !important;
      border: 1.5px solid #334155 !important;
      border-radius: 14px !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6) !important;
    }
    .leaflet-popup-tip {
      background: #0f172a !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex flex-col font-sans selection:bg-emerald-500 selection:text-slate-950">

  <!-- TOP OVERLAY APP BAR -->
  <header class="bg-slate-900/90 border-b border-slate-800/80 px-4 py-3 z-30 backdrop-blur-md shrink-0">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-emerald-500/15 border border-emerald-400/40 flex items-center justify-center text-emerald-400 shrink-0 shadow-lg shadow-emerald-950/50">
          <i data-lucide="locate-fixed" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-black text-white tracking-tight leading-tight">Multi-Device Live GPS Map</h1>
          <p class="text-[10px] text-slate-400 font-mono">All Connected Devices Visible on Map Simultaneously</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 font-mono text-xs">
        <button onclick="toggleMapTileLayer()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold transition flex items-center space-x-1.5 text-xs">
          <i data-lucide="layers" class="w-3.5 h-3.5 text-sky-400"></i>
          <span id="layer-btn-text">ESRI Satellite Map</span>
        </button>

        <span id="active-devices-badge" class="px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-400/30 font-bold flex items-center space-x-1.5 text-xs">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="active-devices-count-text">1 Device Connected</span>
        </span>
      </div>
    </div>
  </header>

  <!-- FULL-SCREEN MAP CANVAS WITH OVERLAY CONTROLS -->
  <div class="flex-1 relative w-full h-full overflow-hidden">
    
    <!-- THE MAIN LEAFLET MAP CANVAS (FULL-SCREEN FULL-BLEED) -->
    <div id="leaflet-map" class="w-full h-full bg-slate-950 z-0"></div>

    <!-- FLOATING TOP-LEFT ACTION CONTROL CARDS OVERLAY -->
    <div class="absolute top-4 left-4 z-20 flex flex-col space-y-2 max-w-sm w-full pointer-events-none">
      
      <!-- Primary Controls Container -->
      <div class="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800/80 backdrop-blur-md shadow-2xl space-y-2.5 pointer-events-auto">
        <div class="flex items-center justify-between text-xs font-mono">
          <span class="font-bold text-white flex items-center space-x-1.5">
            <i data-lucide="navigation" class="w-3.5 h-3.5 text-emerald-400"></i>
            <span>Live GPS Controls</span>
          </span>
          <span class="text-[10px] text-slate-400" id="my-device-short-id">Dev #----</span>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <button 
            id="btn-get-gps"
            onclick="getSingleGpsLocation()" 
            class="py-2.5 px-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black flex items-center justify-center space-x-1.5 transition shadow-lg shadow-emerald-950/50 cursor-pointer"
          >
            <i data-lucide="crosshair" class="w-4 h-4"></i>
            <span>Broadcast Fix</span>
          </button>

          <button 
            id="btn-toggle-tracking"
            onclick="toggleLiveGpsTracking()" 
            class="py-2.5 px-3 rounded-xl bg-slate-950 hover:bg-slate-800 text-slate-100 border border-slate-700 font-bold flex items-center justify-center space-x-1.5 transition cursor-pointer"
          >
            <i data-lucide="radar" class="w-4 h-4 text-emerald-400"></i>
            <span id="tracking-btn-label">Track Live</span>
          </button>
        </div>

        <button 
          id="btn-simulate-5-devices"
          onclick="simulate5Devices()" 
          class="w-full py-2.5 px-3 rounded-xl bg-sky-500/15 hover:bg-sky-500/25 text-sky-300 border border-sky-400/30 font-bold text-xs flex items-center justify-center space-x-2 transition cursor-pointer"
        >
          <i data-lucide="users" class="w-4 h-4 text-sky-400"></i>
          <span>Simulate 5 Devices on Map</span>
        </button>
      </div>

      <!-- Quick Map Utilities Overlay Card -->
      <div class="p-2.5 rounded-2xl bg-slate-900/90 border border-slate-800/80 backdrop-blur-md shadow-xl flex items-center justify-between text-xs font-mono pointer-events-auto">
        <button onclick="fitMapToAllDevices()" class="px-3 py-1.5 rounded-xl bg-slate-950 hover:bg-slate-800 text-emerald-400 border border-emerald-500/30 font-bold flex items-center space-x-1.5 transition">
          <i data-lucide="maximize" class="w-3.5 h-3.5"></i>
          <span>Fit Map to All 5 Devices</span>
        </button>

        <button onclick="clearAllSimulatedDevices()" class="px-2.5 py-1.5 rounded-xl text-rose-400 hover:bg-rose-500/10 font-bold text-[11px] transition">
          Reset Fleet
        </button>
      </div>

    </div>

    <!-- FLOATING BOTTOM ROSTER DRAWER TOGGLE & ADDRESS OVERLAY -->
    <div class="absolute bottom-4 left-4 right-4 z-20 pointer-events-none flex flex-col items-center">
      <div class="max-w-xl w-full p-3.5 rounded-2xl bg-slate-900/95 border border-slate-800/90 backdrop-blur-md shadow-2xl space-y-2 pointer-events-auto">
        <div class="flex items-center justify-between text-xs font-mono">
          <div class="flex items-center space-x-2 text-white font-bold">
            <i data-lucide="map-pin" class="w-4 h-4 text-emerald-400"></i>
            <span id="address-label-text">Broadcasting Live Coordinates...</span>
          </div>
          <button onclick="toggleRosterDrawer()" class="text-sky-400 hover:text-sky-300 font-bold flex items-center space-x-1 text-[11px]">
            <i data-lucide="list" class="w-3.5 h-3.5"></i>
            <span id="roster-toggle-text">Show Fleet Roster (5)</span>
          </button>
        </div>
      </div>
    </div>

    <!-- FLOATING FLEET ROSTER SLIDE-OVER DRAWER -->
    <div id="roster-drawer" class="hidden absolute top-4 bottom-20 right-4 z-20 w-80 sm:w-96 bg-slate-900/95 border border-slate-800 backdrop-blur-xl rounded-3xl p-4 space-y-3 shadow-2xl flex flex-col pointer-events-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5 text-xs font-mono font-bold text-white">
        <span class="flex items-center space-x-2">
          <i data-lucide="users" class="w-4 h-4 text-emerald-400"></i>
          <span>Active Devices Roster</span>
        </span>
        <button onclick="toggleRosterDrawer()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div id="devices-roster-grid" class="flex-1 overflow-y-auto space-y-2 text-xs font-mono">
        <!-- Dynamically populated device cards -->
      </div>
    </div>

    <!-- NOTIFICATION TOAST BANNER OVERLAY -->
    <div id="toast-banner" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-30 px-5 py-3 rounded-2xl bg-emerald-500/90 text-slate-950 font-mono text-xs font-black flex items-center space-x-2 shadow-2xl backdrop-blur-md">
      <i data-lucide="check-circle" class="w-4 h-4 text-slate-950"></i>
      <span id="toast-message">GPS location updated successfully!</span>
    </div>

  </div>

  <!-- JAVASCRIPT GEOLOCATION & MULTI-DEVICE MAP ENGINE -->
  <script>
    // Device State
    let myDeviceId = localStorage.getItem('chronos_my_device_id');
    if (!myDeviceId) {
      myDeviceId = 'dev_' + Math.random().toString(36).substr(2, 6);
      localStorage.setItem('chronos_my_device_id', myDeviceId);
    }

    let myDeviceName = localStorage.getItem('chronos_my_device_name') || `Mobile Device #${myDeviceId.substr(-4)}`;
    
    // Map State
    let currentLat = null;
    let currentLng = null;
    let watchId = null;
    let map = null;
    let currentMapTile = 'dark'; // 'dark' or 'satellite'
    let darkTileLayer = null;
    let satTileLayer = null;
    let deviceMarkers = {};
    let deviceCircles = {};

    // Device Color Palette for 5+ Devices
    const DEVICE_COLORS = [
      { stroke: '#10b981', fill: 'rgba(16, 185, 129, 0.4)', bg: 'bg-emerald-500', text: 'text-emerald-400', label: 'Emerald' },
      { stroke: '#38bdf8', fill: 'rgba(56, 189, 248, 0.4)', bg: 'bg-sky-500', text: 'text-sky-400', label: 'Sky Blue' },
      { stroke: '#f59e0b', fill: 'rgba(245, 158, 11, 0.4)', bg: 'bg-amber-500', text: 'text-amber-400', label: 'Amber' },
      { stroke: '#c084fc', fill: 'rgba(192, 132, 252, 0.4)', bg: 'bg-purple-500', text: 'text-purple-400', label: 'Purple' },
      { stroke: '#f43f5e', fill: 'rgba(244, 63, 94, 0.4)', bg: 'bg-rose-500', text: 'text-rose-400', label: 'Rose' },
      { stroke: '#06b6d4', fill: 'rgba(6, 182, 212, 0.4)', bg: 'bg-cyan-500', text: 'text-cyan-400', label: 'Cyan' }
    ];

    const gpsOptions = {
      enableHighAccuracy: true,
      timeout: 12000,
      maximumAge: 0
    };

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('my-device-short-id').innerText = `${myDeviceName}`;

      initMap();
      startCrossDevicePolling();
      lucide.createIcons();
    });

    function initMap() {
      map = L.map('leaflet-map', {
        center: [19.0435, 73.0253], // Default Navi Mumbai / Stadium area
        zoom: 14,
        zoomControl: false,
        attributionControl: false
      });

      // Custom Zoom control positioning
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // Dark Vector Map Tile Layer
      darkTileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd'
      }).addTo(map);

      // ESRI High-Res Satellite Imagery Layer
      satTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19
      });
    }

    function toggleMapTileLayer() {
      const label = document.getElementById('layer-btn-text');
      if (currentMapTile === 'dark') {
        map.removeLayer(darkTileLayer);
        map.addLayer(satTileLayer);
        currentMapTile = 'satellite';
        if (label) label.innerText = "Dark Vector Map";
      } else {
        map.removeLayer(satTileLayer);
        map.addLayer(darkTileLayer);
        currentMapTile = 'dark';
        if (label) label.innerText = "ESRI Satellite Map";
      }
    }

    async function broadcastLocationPayload(lat, lng, accuracy, altitude, speed) {
      const payload = {
        id: myDeviceId,
        name: myDeviceName,
        lat: lat,
        lng: lng,
        accuracy: accuracy || 10,
        altitude: altitude || null,
        speed: speed || 0,
        timestamp: new Date().toISOString()
      };

      let list = getSharedDevicesList();
      list = list.filter(d => d.id !== myDeviceId);
      list.unshift(payload);

      try {
        localStorage.setItem('chronos_device_locations', JSON.stringify(list));
      } catch (e) {}

      try {
        await fetch('/api/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: 'chronos_device_locations', value: list })
        });
      } catch (e) {}

      renderAllDevicesOnMap(list);
    }

    function getSharedDevicesList() {
      try {
        const stored = localStorage.getItem('chronos_device_locations');
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    }

    function startCrossDevicePolling() {
      setInterval(async () => {
        let list = [];
        try {
          const res = await fetch('/api/sync?key=chronos_device_locations');
          if (res.ok) {
            const json = await res.json();
            if (json && json.value && Array.isArray(json.value)) {
              list = json.value;
              localStorage.setItem('chronos_device_locations', JSON.stringify(list));
            }
          }
        } catch (e) {
          list = getSharedDevicesList();
        }

        if (list.length === 0) {
          list = getSharedDevicesList();
        }

        const now = Date.now();
        list = list.filter(d => (now - new Date(d.timestamp).getTime()) < 180000);

        renderAllDevicesOnMap(list);
      }, 2000);
    }

    // Render All Active Connected Devices Simultaneously on Map
    function renderAllDevicesOnMap(devices) {
      if (!map) return;

      const badgeCount = document.getElementById('active-devices-count-text');
      const rosterToggle = document.getElementById('roster-toggle-text');
      
      if (badgeCount) {
        badgeCount.innerText = `${devices.length} ${devices.length === 1 ? 'Device' : 'Devices'} Connected`;
      }
      if (rosterToggle) {
        rosterToggle.innerText = `Fleet Roster (${devices.length})`;
      }

      const activeIds = new Set(devices.map(d => d.id));

      Object.keys(deviceMarkers).forEach(id => {
        if (!activeIds.has(id)) {
          map.removeLayer(deviceMarkers[id]);
          delete deviceMarkers[id];
          if (deviceCircles[id]) {
            map.removeLayer(deviceCircles[id]);
            delete deviceCircles[id];
          }
        }
      });

      devices.forEach((dev, idx) => {
        const style = DEVICE_COLORS[idx % DEVICE_COLORS.length];
        const isMe = dev.id === myDeviceId;

        // 1. Update or Create Accuracy Circle
        if (deviceCircles[dev.id]) {
          deviceCircles[dev.id].setLatLng([dev.lat, dev.lng]);
          deviceCircles[dev.id].setRadius(dev.accuracy || 10);
        } else {
          deviceCircles[dev.id] = L.circle([dev.lat, dev.lng], {
            radius: dev.accuracy || 10,
            color: style.stroke,
            fillColor: style.stroke,
            fillOpacity: 0.14,
            weight: 2,
            dashArray: '4, 4'
          }).addTo(map);
        }

        // 2. Custom Color-Coded Numbered Pin Icon with Label
        const iconHtml = `
          <div style="position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; transform: translate(-50%, -50%);">
            <div style="position: absolute; width: 34px; height: 34px; border-radius: 50%; background: ${style.fill}; top: -3px;" class="gps-pulse-ring"></div>
            <div style="width: 28px; height: 28px; border-radius: 50%; background: ${style.stroke}; border: 3px solid #ffffff; box-shadow: 0 0 16px ${style.stroke}; display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: 900; font-size: 12px; font-family: monospace; z-index: 2;">
              ${idx + 1}
            </div>
            <div style="margin-top: 3px; font-size: 10px; font-family: monospace; font-weight: bold; color: #ffffff; background: rgba(15,23,42,0.95); padding: 2px 7px; border-radius: 6px; border: 1px solid ${style.stroke}; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
              ${dev.name} ${isMe ? '(YOU)' : ''}
            </div>
          </div>
        `;

        const gpsIcon = L.divIcon({
          className: 'multi-device-pin',
          html: iconHtml,
          iconSize: [140, 50],
          iconAnchor: [70, 25]
        });

        if (deviceMarkers[dev.id]) {
          deviceMarkers[dev.id].setLatLng([dev.lat, dev.lng]);
          deviceMarkers[dev.id].setIcon(gpsIcon);
        } else {
          deviceMarkers[dev.id] = L.marker([dev.lat, dev.lng], { icon: gpsIcon }).addTo(map);
        }

        deviceMarkers[dev.id].bindPopup(`
          <div style="font-family: monospace; font-size: 11px; padding: 4px; min-width: 180px;">
            <div style="font-weight: bold; color: ${style.stroke}; font-size: 13px; margin-bottom: 3px;">
              ${dev.name} ${isMe ? '(YOU)' : ''}
            </div>
            <div>Device ID: <strong>${dev.id}</strong></div>
            <div>Lat: <strong>${dev.lat.toFixed(6)}°</strong></div>
            <div>Lng: <strong>${dev.lng.toFixed(6)}°</strong></div>
            <div style="color: #94a3b8;">Accuracy: &plusmn;${(dev.accuracy || 10).toFixed(1)}m</div>
            <div style="color: #64748b; font-size: 10px; margin-top: 3px;">Fix Time: ${new Date(dev.timestamp).toLocaleTimeString()}</div>
          </div>
        `);
      });

      renderRosterPanel(devices);
    }

    function renderRosterPanel(devices) {
      const grid = document.getElementById('devices-roster-grid');
      if (!grid) return;

      if (devices.length === 0) {
        grid.innerHTML = `<div class="p-4 rounded-2xl bg-slate-950 text-center text-slate-500">No active devices broadcasting location.</div>`;
        return;
      }

      grid.innerHTML = devices.map((dev, idx) => {
        const style = DEVICE_COLORS[idx % DEVICE_COLORS.length];
        const isMe = dev.id === myDeviceId;
        const timeAgo = Math.round((Date.now() - new Date(dev.timestamp).getTime()) / 1000);

        return `
          <div onclick="focusMapOnDevice(${dev.lat}, ${dev.lng})" class="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 hover:border-slate-700 transition space-y-1.5 cursor-pointer group">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2">
                <span class="w-5 h-5 rounded-full ${style.bg} text-slate-950 font-black flex items-center justify-center text-[10px]">
                  ${idx + 1}
                </span>
                <span class="font-bold text-white group-hover:${style.text} transition">${dev.name}</span>
                ${isMe ? `<span class="px-1.5 py-0.2 rounded text-[9px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">YOU</span>` : ''}
              </div>
              <span class="text-[10px] text-slate-500">${timeAgo}s ago</span>
            </div>

            <div class="grid grid-cols-2 gap-2 text-[10px]">
              <div>
                <span class="text-slate-500">Lat:</span>
                <span class="font-bold text-slate-200">${dev.lat.toFixed(6)}°</span>
              </div>
              <div>
                <span class="text-slate-500">Lng:</span>
                <span class="font-bold text-slate-200">${dev.lng.toFixed(6)}°</span>
              </div>
            </div>

            <div class="flex items-center justify-between text-[10px] text-slate-400 pt-1 border-t border-slate-900">
              <span>Accuracy: <strong class="${style.text}">&plusmn;${(dev.accuracy || 10).toFixed(1)}m</strong></span>
              <span>Speed: <strong>${dev.speed ? (dev.speed * 3.6).toFixed(1) + ' km/h' : '0 km/h'}</strong></span>
            </div>
          </div>
        `;
      }).join('');
    }

    function focusMapOnDevice(lat, lng) {
      if (map) {
        map.setView([lat, lng], 17, { animate: true });
      }
    }

    function fitMapToAllDevices() {
      const devices = getSharedDevicesList();
      if (!map || devices.length === 0) return;

      const bounds = L.latLngBounds(devices.map(d => [d.lat, d.lng]));
      map.fitBounds(bounds, { padding: [70, 70] });
      showToast(`Adjusted map bounds to view all ${devices.length} devices on screen!`);
    }

    function toggleRosterDrawer() {
      const drawer = document.getElementById('roster-drawer');
      if (drawer) {
        drawer.classList.toggle('hidden');
      }
    }

    // Simulate 5 Devices Moving Simultaneously
    function simulate5Devices() {
      const centerLat = currentLat || 19.0435;
      const centerLng = currentLng || 73.0253;

      const simDevices = [
        { id: myDeviceId, name: `${myDeviceName} (Your Device)`, lat: centerLat, lng: centerLng, accuracy: 8, speed: 0 },
        { id: 'sim_dev_02', name: 'Field Medical Ambulance #2', lat: centerLat + 0.0042, lng: centerLng - 0.0035, accuracy: 12, speed: 4.2 },
        { id: 'sim_dev_03', name: 'Shuttle Bus Loop #14', lat: centerLat - 0.0038, lng: centerLng + 0.0041, accuracy: 15, speed: 8.5 },
        { id: 'sim_dev_04', name: 'Spectator Visitor App #819', lat: centerLat + 0.0028, lng: centerLng + 0.0032, accuracy: 9, speed: 1.1 },
        { id: 'sim_dev_05', name: 'Perimeter Security Command', lat: centerLat - 0.0025, lng: centerLng - 0.0028, accuracy: 5, speed: 0 }
      ];

      simDevices.forEach(d => d.timestamp = new Date().toISOString());

      try {
        localStorage.setItem('chronos_device_locations', JSON.stringify(simDevices));
      } catch (e) {}

      try {
        fetch('/api/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: 'chronos_device_locations', value: simDevices })
        }).catch(() => {});
      } catch (e) {}

      renderAllDevicesOnMap(simDevices);
      fitMapToAllDevices();
      showToast("Simulated 5 active devices on map simultaneously!");
    }

    function clearAllSimulatedDevices() {
      localStorage.removeItem('chronos_device_locations');
      if (currentLat && currentLng) {
        broadcastLocationPayload(currentLat, currentLng, 10, 0, 0);
      } else {
        renderAllDevicesOnMap([]);
      }
      showToast("Fleet roster reset.");
    }

    // Single GPS Location Fetch
    function getSingleGpsLocation() {
      const btn = document.getElementById('btn-get-gps');
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser or device.");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>GPS Fix...</span>`;
      lucide.createIcons();

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const coords = position.coords;
          currentLat = coords.latitude;
          currentLng = coords.longitude;
          broadcastLocationPayload(currentLat, currentLng, coords.accuracy, coords.altitude, coords.speed);
          
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="crosshair" class="w-4 h-4"></i><span>Broadcast Fix</span>`;
          
          const label = document.getElementById('address-label-text');
          if (label) label.innerText = `GPS Fix: ${currentLat.toFixed(6)}°, ${currentLng.toFixed(6)}° (\u00B1${coords.accuracy.toFixed(1)}m)`;
          
          showToast(`Broadcasted GPS Fix: ${currentLat.toFixed(6)}°, ${currentLng.toFixed(6)}°`);
          lucide.createIcons();
        },
        (error) => {
          alert(`GPS Error: ${error.message}`);
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="crosshair" class="w-4 h-4"></i><span>Broadcast Fix</span>`;
          lucide.createIcons();
        },
        gpsOptions
      );
    }

    // Continuous Live Tracking (WatchPosition)
    function toggleLiveGpsTracking() {
      const label = document.getElementById('tracking-btn-label');
      const btn = document.getElementById('btn-toggle-tracking');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        label.innerText = "Track Live";
        btn.className = "py-2.5 px-3 rounded-xl bg-slate-950 hover:bg-slate-800 text-slate-100 border border-slate-700 font-bold flex items-center justify-center space-x-1.5 transition cursor-pointer";
        showToast("Live GPS tracking stopped.");
      } else {
        if (!navigator.geolocation) {
          alert("Geolocation is not supported by your browser.");
          return;
        }

        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const coords = position.coords;
            currentLat = coords.latitude;
            currentLng = coords.longitude;
            broadcastLocationPayload(currentLat, currentLng, coords.accuracy, coords.altitude, coords.speed);

            const addressLabel = document.getElementById('address-label-text');
            if (addressLabel) addressLabel.innerText = `Live Tracking: ${currentLat.toFixed(6)}°, ${currentLng.toFixed(6)}°`;
          },
          (error) => {
            console.warn("GPS tracking error:", error.message);
          },
          gpsOptions
        );

        label.innerText = "Stop Track";
        btn.className = "py-2.5 px-3 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 font-bold flex items-center justify-center space-x-1.5 transition cursor-pointer";
        showToast("Live multi-device GPS tracking active!");
      }
    }

    function showToast(msg) {
      const banner = document.getElementById('toast-banner');
      const msgEl = document.getElementById('toast-message');
      if (banner && msgEl) {
        msgEl.innerText = msg;
        banner.classList.remove('hidden');
        setTimeout(() => { banner.classList.add('hidden'); }, 3500);
      }
    }
  </script>
</body>
</html>
