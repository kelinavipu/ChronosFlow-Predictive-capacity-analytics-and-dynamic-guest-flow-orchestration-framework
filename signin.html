<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ChronosFlow Event Orchestration</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="navbar.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#080c14] text-slate-100 min-h-screen flex flex-col font-sans selection:bg-sky-400 selection:text-slate-950">

  <!-- Global Shared Navbar -->
  <div id="global-navbar"></div>

  <!-- Sign In Form Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-8">
    <div class="dark-panel rounded-3xl p-6 sm:p-10 border border-[#2a2c35] max-w-lg w-full shadow-2xl space-y-6">
      
      <!-- Brand & Header -->
      <div class="text-center space-y-1.5">
        <div class="w-12 h-12 rounded-2xl bg-[#22242b] border border-[#2a2c35] flex items-center justify-center text-[#d4a373] mx-auto mb-3">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-black text-[#ede8e1]">Access Operational Command</h1>
        <p class="text-xs text-[#9e9b93]">Select your stakeholder role to sign into the ChronosFlow grid</p>
      </div>

      <!-- Role Selection Pills -->
      <div class="space-y-2">
        <label class="block text-xs font-bold text-[#9e9b93] uppercase tracking-wider">Select Role</label>
        <div class="grid grid-cols-2 gap-2 text-xs font-semibold" id="role-selector-grid">
          <button type="button" onclick="selectRole('event_manager')" class="role-pill active-role p-2.5 rounded-xl border border-[#2a2c35] bg-[#22242b] text-[#d4a373] flex items-center space-x-2 transition" data-role="event_manager">
            <i data-lucide="clipboard-list" class="w-4 h-4"></i>
            <span>Event Manager</span>
          </button>
          
          <button type="button" onclick="selectRole('visitor')" class="role-pill p-2.5 rounded-xl border border-[#2a2c35] bg-[#1a1b20] text-[#9e9b93] hover:text-[#ede8e1] flex items-center space-x-2 transition" data-role="visitor">
            <i data-lucide="users" class="w-4 h-4"></i>
            <span>Visitor</span>
          </button>

          <button type="button" onclick="selectRole('service_provider')" class="role-pill p-2.5 rounded-xl border border-[#2a2c35] bg-[#1a1b20] text-[#9e9b93] hover:text-[#ede8e1] flex items-center space-x-2 transition" data-role="service_provider">
            <i data-lucide="utensils" class="w-4 h-4"></i>
            <span>Service Provider</span>
          </button>

          <button type="button" onclick="selectRole('infra_provider')" class="role-pill p-2.5 rounded-xl border border-[#2a2c35] bg-[#1a1b20] text-[#9e9b93] hover:text-[#ede8e1] flex items-center space-x-2 transition" data-role="infra_provider">
            <i data-lucide="train" class="w-4 h-4"></i>
            <span>Infra Provider</span>
          </button>
        </div>
      </div>

      <!-- Sign In Form -->
      <form id="signin-form" onsubmit="handleSignIn(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-[#9e9b93] uppercase mb-1">Email / Operational ID</label>
            <input 
              type="email" 
              id="signin-email" 
              required 
              placeholder="e.g. planner@chronosflow.org" 
              class="w-full px-4 py-2.5 rounded-xl bg-[#1a1b20] border border-[#2a2c35] text-[#ede8e1] focus:border-[#d4a373] outline-none text-xs"
            >
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-bold text-[#9e9b93] uppercase">Password</label>
            <a href="#" class="text-[11px] text-[#d4a373] hover:underline">Forgot credentials?</a>
          </div>
          <input 
            type="password" 
            id="signin-password" 
            required 
            placeholder="••••••••••••" 
            class="w-full px-4 py-2.5 rounded-xl bg-[#1a1b20] border border-[#2a2c35] text-[#ede8e1] focus:border-[#d4a373] outline-none text-xs"
          >
        </div>

        <button type="submit" id="signin-submit-btn" class="w-full py-3 rounded-xl btn-sand font-bold text-xs flex items-center justify-center space-x-2 shadow-lg transition">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span id="signin-btn-text">Sign In to Dashboard</span>
        </button>
      </form>

      <!-- Link to Sign Up -->
      <div class="text-center text-xs text-[#9e9b93]">
        Don't have an operational account? 
        <a href="signup.html" id="link-signup" class="font-bold text-[#d4a373] hover:underline">Register here</a>
      </div>

    </div>
  </main>

  <script>
    let currentRole = 'event_manager';

    function selectRole(role) {
      currentRole = role;
      document.querySelectorAll('.role-pill').forEach(btn => {
        if (btn.getAttribute('data-role') === role) {
          btn.className = "role-pill active-role p-2.5 rounded-xl border border-[#d4a373] bg-[#22242b] text-[#d4a373] flex items-center space-x-2 transition";
        } else {
          btn.className = "role-pill p-2.5 rounded-xl border border-[#2a2c35] bg-[#1a1b20] text-[#9e9b93] hover:text-[#ede8e1] flex items-center space-x-2 transition";
        }
      });
      document.getElementById('link-signup').href = `signup.html?role=${role}`;
    }

    async function handleSignIn(e) {
      e.preventDefault();
      const email = document.getElementById('signin-email').value;
      const password = document.getElementById('signin-password').value;
      const btn = document.getElementById('signin-submit-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin inline-block mr-2">&bull;</span> Signing in...`;

      const result = await window.ChronosSupabase.signIn(email, password, currentRole);
      
      // Redirect based on role
      if (currentRole === 'event_manager') {
        window.location.href = "preplans.html";
      } else if (currentRole === 'infra_provider') {
        window.location.href = "dashboard-infra.html";
      } else if (currentRole === 'service_provider') {
        window.location.href = "dashboard-service.html";
      } else if (currentRole === 'visitor') {
        window.location.href = "dashboard-visitor.html";
      } else {
        window.location.href = "index.html";
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('signin');
      const params = new URLSearchParams(window.location.search);
      const roleParam = params.get('role');
      if (roleParam && ['event_manager', 'visitor', 'service_provider', 'infra_provider'].includes(roleParam)) {
        selectRole(roleParam);
      }
      lucide.createIcons();
    });
  </script>
</body>
</html>
